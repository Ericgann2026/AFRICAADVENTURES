<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Africa Adventures</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    rgba(0,0,0,0.55),
                    rgba(0,0,0,0.55)
                ),
                url("https://images.unsplash.com/photo-1516026672322-bc52d61a55d5?auto=format&fit=crop&w=1600&q=80");

            background-size: cover;

            background-position: center;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;
        }

        .login-box {

            background: white;

            width: 90%;

            max-width: 430px;

            padding: 35px;

            border-radius: 18px;

            box-shadow:
                0 10px 35px rgba(0,0,0,0.3);

        }

        .logo {

            text-align: center;

            font-size: 28px;

            font-weight: bold;

            color: #1f3d2b;

            margin-bottom: 10px;
        }

        h1 {

            text-align: center;

            margin-bottom: 25px;

            color: #333;

        }

        label {

            display: block;

            font-weight: bold;

            margin-bottom: 7px;

        }

        input {

            width: 100%;

            padding: 14px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 16px;

            margin-bottom: 18px;
        }

        button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #1f3d2b;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

        }

        button:hover {

            background: #315b40;

        }

        .error {

            background: #f8d7da;

            color: #842029;

            padding: 12px;

            border-radius: 7px;

            margin-bottom: 20px;

            text-align: center;

        }

        .back {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: #1f3d2b;

            text-decoration: none;

        }

    </style>

</head>


<body>


<div class="login-box">

    <div class="logo">
        🌍 Africa Adventures
    </div>

    <h1>
        Admin Login
    </h1>


    {% if error %}

    <div class="error">

        {{ error }}

    </div>

    {% endif %}


    <form
        action="/admin/login"
        method="POST"
    >

        <label>
            Username
        </label>

        <input
            type="text"
            name="username"
            placeholder="Enter username"
            required
        >


        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            placeholder="Enter password"
            required
        >


        <button type="submit">

            🔐 Login

        </button>

    </form>


    <a
        href="/"
        class="back"
    >

        ← Back to website

    </a>

</div>


</body>

</html>
