services:
  - type: web
    name: africa-countries-adventure-safaris
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_PATH
        value: /var/data/bookings.db
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
    disk:
      name: booking-data
      mountPath: /var/data
      sizeGB: 1
